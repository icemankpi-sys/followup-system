<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--surface2:#f7f9fc;--ink:#0f1b2d;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;
  --primary:#2e3192;--primary-ink:#fff;--primary-soft:#e9e9f7;--accent:#e8590c;--accent-soft:#fff1e8;
  --ok:#0f7a55;--ok-soft:#e5f6ef;--warn:#b45309;--warn-soft:#fdf3e2;--danger:#b42318;--danger-soft:#fdecea;--violet:#6d28d9;--age-r:#fde0dd;--age-o:#ffe6cc;--age-y:#fff5bf;--age-g:#e1f4e4;
  --head:#1d1f63;--head-ink:#eef0ff;--head-chip:#2a2d7d;--shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06);--radius:12px;
  color-scheme:light}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1220;--surface:#121b2b;--surface2:#0f1726;--ink:#e6edf7;--ink2:#c3cfdf;--muted:#8b9bb2;--line:#22314a;--line2:#2e4060;
  --primary:#8e92f2;--primary-ink:#0b0d2e;--primary-soft:#1f2257;--accent:#ff8a3d;--accent-soft:#2a1a10;
  --ok:#34c391;--ok-soft:#0f2a22;--warn:#f0a94a;--warn-soft:#2b210f;--danger:#f17066;--danger-soft:#2c1414;--violet:#b49cff;--age-r:#3d1a1a;--age-o:#3d2810;--age-y:#36310e;--age-g:#11301d;
  --head:#0d0e33;--head-ink:#e6e8ff;--head-chip:#1c1f55;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Sinhala",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-width:0}
header{background:var(--head);color:var(--head-ink);padding:10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.mark{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;padding:4px}.mark img{max-width:100%;max-height:100%}
header h1{font-size:16px;margin:0;font-weight:700}header .sub{font-size:12px;opacity:.7}
.pill{background:var(--head-chip);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 12px;font-size:12px;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--head-ink);border-radius:8px;padding:5px 11px;cursor:pointer}
#tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 max(16px,env(safe-area-inset-left));overflow-x:auto}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
#tabs button.on{color:var(--primary);border-color:var(--primary)}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 120px)}
aside{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:0;align-self:stretch}
.sh{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:2px 8px 8px}
.mod{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink2);margin-bottom:2px}
.mod:hover{background:var(--surface2)}.mod.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.mod .ic{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.mod.soon .ic{background:var(--line2);color:var(--surface)}.mod .tx{flex:1;min-width:0}.mod .tx small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cnt{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
#content{flex:1;min-width:0;padding:14px max(16px,env(safe-area-inset-right)) 30px 16px}
/* guard (v3.6.1): a browser extension on some PCs injects a "#content {font-size:22px; color:#fff; float:left; width:460px}" style
   (an IIS / Azure default-page stylesheet). section#content is more specific, so the app keeps its own look whatever is injected. */
section#content{font-family:inherit;font-weight:inherit;font-size:14px;color:var(--ink);float:none;width:auto;margin-top:0;margin-left:0;vertical-align:baseline}
section#content h1{font-family:inherit;color:inherit;font-size:revert;line-height:normal;width:auto}
section#content p a,section#content p a:visited,section#content p a:hover{color:var(--primary)}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h2.pt{margin:0 0 2px;font-size:20px;color:var(--ink)}.hint{color:var(--muted);font-size:12.5px;margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:14px;color:var(--primary)}
.tile{background:var(--surface);border-radius:var(--radius);padding:10px 12px;border-left:5px solid var(--primary);box-shadow:var(--shadow)}
.tile b{display:block;font-size:19px}.tile span{font-size:12px;color:var(--muted)}
.tile.r{border-color:var(--danger)}.tile.a{border-color:var(--accent)}.tile.g{border-color:var(--ok)}

}
async function api(path, opt) {

  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw new Error(m || ('HTTP ' + r.status)); }
  return r.status === 204 ? null : r.json().catch(() => null);
}

      const P = {officer: [['collection', 'edit']], manager: [['collection', 'view']], finance: [['collection', 'full'], ['receivable', 'view'], ['short_expiry', 'view'], ['foc', 'full']], rep: [['rep', 'edit']], ophead: [['receivable', 'edit'], ['collection', 'view'], ['short_expiry', 'edit']], director: [['*', 'view']], legal: [['receivable', 'view']], stores: [['short_expiry', 'full']]};
      const T = {officer: 'Operation Officer', finance: 'Accounts', rep: 'Sales Rep', ophead: 'Operation Head', director: 'Director', legal: 'Legal Officer', stores: 'Stores Officer'}, k = $('pRole').value, u = uData.users.find(x => x.id === uSel);
      for (const x of P[k]) await api('/rest/v1/fu_access?on_conflict=user_id,module,operation', {method: 'POST', body: {user_id: uSel, module: x[0], operation: $('pOp').value, level: x[1]}, headers: {Prefer: 'resolution=merge-duplicates,return=minimal'}});
      if (T[k] && u && !u.job_title) await api('/rest/v1/profiles?id=eq.' + uSel, {method: 'PATCH', body: {job_title: T[k]}, headers: {Prefer: 'return=minimal'}});
      await reload('Role applied.');
    }
    else if (act === 'add') { await api('/rest/v1/fu_access?on_conflict=user_id,module,operation', {method: 'POST', body: {user_id: uSel, module: $('aMod').value, operation: $('aOp').value, level: $('aLv').value}, headers: {Prefer: 'resolution=merge-duplicates,return=minimal'}}); await reload(); }
    else if (act === 'rm') { await api('/rest/v1/fu_access?id=eq.' + id, {method: 'DELETE', headers: {Prefer: 'return=minimal'}}); await reload(); }
  } catch (er) { const m = $('uMsg'); if (m) m.textContent = er.message; }
}

// ---------- ice cubes on the login screen ----------
(function () {
  const cv = $('ice'), cx = cv.getContext('2d'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, parts = [], run = false, lx = 0, ly = 0;
  function size() { const d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener('resize', size);
  function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function spawn(x, y, n, burst) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, sp = (burst ? 3.2 : 1.4) * Math.random() + 0.4;
      parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (burst ? 2 : 0.6), s: 7 + Math.random() * (burst ? 16 : 10), rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, life: 0, max: 70 + Math.random() * 70, cube: Math.random() < 0.6, hue: 190 + Math.random() * 35}); }
    if (parts.length > 280) parts.splice(0, parts.length - 280);
    if (!run) { run = true; requestAnimationFrame(tick); }
  }
  function draw(p, k) {
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, k * 1.7); const s = p.s;
    const g = cx.createLinearGradient(-s, -s, s, s); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'hsla(' + p.hue + ',90%,68%,.55)');
    cx.fillStyle = g; cx.strokeStyle = 'rgba(255,255,255,.95)'; cx.lineWidth = 1.2;
    if (p.cube) { rr(-s / 2, -s / 2, s, s, s * 0.22); cx.fill(); cx.stroke(); cx.beginPath(); cx.moveTo(-s * 0.28, -s * 0.28); cx.lineTo(s * 0.06, -s * 0.28); cx.lineWidth = 1.8; cx.stroke(); }
    else { cx.beginPath(); cx.moveTo(0, -s); cx.lineTo(s * 0.55, s * 0.45); cx.lineTo(-s * 0.5, s * 0.6); cx.closePath(); cx.fill(); cx.stroke(); }
    cx.restore();
  }
  function tick() {
    if ($('login').hidden) { run = false; parts = []; cx.clearRect(0, 0, W, H); return; }
    cx.clearRect(0, 0, W, H); parts = parts.filter(p => p.life < p.max);
    parts.forEach(p => { p.life++; p.vy += 0.07; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.rot += p.vr; draw(p, 1 - p.life / p.max); });
    if (parts.length) requestAnimationFrame(tick); else run = false;
  }
  if (reduce) return;
  addEventListener('mousemove', e => { if ($('login').hidden) return; if (Math.hypot(e.clientX - lx, e.clientY - ly) > 14) { spawn(e.clientX, e.clientY, 2); lx = e.clientX; ly = e.clientY; } });
  addEventListener('mousedown', e => { if (!$('login').hidden) spawn(e.clientX, e.clientY, 18, true); });
  addEventListener('touchmove', e => { if ($('login').hidden || !e.touches[0]) return; const t = e.touches[0]; if (Math.hypot(t.clientX - lx, t.clientY - ly) > 14) { spawn(t.clientX, t.clientY, 2); lx = t.clientX; ly = t.clientY; } }, {passive: true});
})();
// ---------- events ----------
$('lbtn').onclick = signIn; $('lpass').onkeydown = e => { if (e.key === 'Enter') signIn(); };
$('logout').onclick = signOut;
$('tabs').onclick = e => { const b = e.target.closest('button[data-page]'); if (b) { clearHash(); go(b.dataset.page); } };
$('mods').onclick = e => { const b = e.target.closest('button[data-mod]'); if (b) { clearHash(); go(['items', 'dash', 'report'].includes(page) ? page : 'items', b.dataset.mod); } };
$('bar').onchange = e => { if (e.target.id === 'opSel') { op = e.target.value; go(); } };
$('page').onclick = e => {
  const u = e.target.closest('[data-uact]'); if (u && u.tagName !== 'SELECT') return permClick(u);
  if (e.target.id === 'rPrint') return window.print();
  if (e.target.id === 'rCsv') return exportCsv();
  const q = e.target.closest('[data-quick]'); if (q) return openPanel(q.dataset.quick);
  const ra = e.target.closest('[data-ract]'); if (ra) { if (ra.dataset.ract === 'present') return setPresent(!document.body.classList.contains('present')); if (ra.dataset.ract === 'contact') return contactDrawer(); return drawer(ra.dataset.ract, false); }
  const tf = e.target.closest('[data-tlf]'); if (tf) { tlF = tf.dataset.tlf; return paintTl(); }
  const bk = e.target.closest('[data-back]'); if (bk) { clearHash(); return go('items'); }
  const rc = e.target.closest('[data-rec]'); if (rc) { if (!rc.disabled) location.replace('#item/' + rc.dataset.rec); return; }
  const o = e.target.closest('[data-open]'); if (o) return openRecord(o.dataset.open);
  const c = e.target.closest('[data-go]'); if (c) go(c.dataset.go, c.dataset.mod);
};
$('page').onchange = async e => {
  const s = e.target;
  if (s.dataset && s.dataset.uact === 'lv') { try { await api('/rest/v1/fu_access?id=eq.' + s.dataset.id, {method: 'PATCH', body: {level: s.value}, headers: {Prefer: 'return=minimal'}}); uData = await fn({action: 'list'}); renderUsers(''); } catch (er) { $('uMsg').textContent = er.message; } return; }
  const map = {fChain: 'chain', fOutlet: 'outlet', fRep: 'rep', fReason: 'reason', fBucket: 'bucket', fStatus: 'status', fFlag: 'flag'};
  if (map[s.id]) { F[map[s.id]] = s.value; renderItems(); }
};
$('page').oninput = e => { if (e.target.id === 'fText') { F.text = e.target.value; renderItems(); } };
document.addEventListener('click', e => { if (e.target.id === 'fClear') { F = {chain: '', outlet: '', rep: '', reason: '', bucket: '', status: 'active', flag: '', text: ''}; $('fText').value = ''; renderItems(); } });
$('sbToggle').onclick = () => { sbCol = !sbCol; try { localStorage.setItem('fu_sb', sbCol ? '1' : '0'); } catch (e) {} go(); };
$('panel').onclick = e => {
  const b = e.target.closest('[data-recpage]'); if (b) { closeDrawer(); openRecord(b.dataset.recpage); return; }
  const a = e.target.closest('[data-pact]'); if (!a) return; const k = a.dataset.pact, fl = $('panel').dataset.from === '1';
  if (k === 'close') closeDrawer(); else if (k === 'save') guard(save); else if (k === 'post') guard(postNote); else if (k === 'savecontact') guard(saveContact); else if (k === 'contact') contactDrawer(); else drawer(k, fl);
};
$('panel').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'dNote') { e.preventDefault(); const b = document.querySelector('#panel [data-pact="save"],#panel [data-pact="post"]'); if (b) b.click(); } };
function setPresent(on) {
  document.body.classList.toggle('present', on);
  const b = document.querySelector('[data-ract="present"]'); if (b) b.innerHTML = on ? 'Exit present' : '&#x26F6; Present';
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('panel').classList.contains('open')) closeDrawer(); else if (document.body.classList.contains('present')) setPresent(false); });
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#item/')) setPresent(false); });
window.addEventListener('hashchange', () => { if (me) route(); });
if (sess) start();
